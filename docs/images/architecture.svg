<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fe4"/></marker><marker id="blue-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2f6fe4"/></marker><marker id="pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e0457b"/></marker><marker id="pink-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#e0457b"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker><marker id="gray-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#8a8a8a"/></marker></defs>
<rect width="960" height="420" fill="#ffffff"/>
<text x="30" y="42" font-size="22" font-weight="700" fill="#111111">MicroHTTP 구조</text>
<rect x="30" y="200" width="150" height="64" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="105.0" y="232.0" font-size="17" font-weight="700" fill="#111111" text-anchor="middle" dominant-baseline="middle">브라우저</text>
<rect x="270" y="200" width="170" height="64" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="355.0" y="220.9" font-size="17" font-weight="700" fill="#111111" text-anchor="middle" dominant-baseline="middle">main 스레드</text>
<text x="355.0" y="243.0" font-size="17" font-weight="700" fill="#111111" text-anchor="middle" dominant-baseline="middle">accept 루프</text>
<rect x="520" y="200" width="170" height="64" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="605.0" y="232.0" font-size="17" font-weight="700" fill="#111111" text-anchor="middle" dominant-baseline="middle">작업 스레드 ×8</text>
<rect x="520" y="70" width="170" height="64" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="605.0" y="92.2" font-size="15" font-weight="700" fill="#111111" text-anchor="middle" dominant-baseline="middle">Session 저장소</text>
<text x="605.0" y="111.8" font-size="15" font-weight="700" fill="#111111" text-anchor="middle" dominant-baseline="middle">리스트 + mutex</text>
<rect x="770" y="70" width="170" height="64" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="855.0" y="92.2" font-size="15" font-weight="700" fill="#111111" text-anchor="middle" dominant-baseline="middle">auth.c</text>
<text x="855.0" y="111.8" font-size="15" font-weight="700" fill="#111111" text-anchor="middle" dominant-baseline="middle">/login /logout /me</text>
<rect x="770" y="200" width="170" height="64" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="855.0" y="232.0" font-size="17" font-weight="700" fill="#111111" text-anchor="middle" dominant-baseline="middle">정적 파일</text>
<rect x="770" y="320" width="170" height="64" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="855.0" y="342.2" font-size="15" font-weight="700" fill="#111111" text-anchor="middle" dominant-baseline="middle">proxy.c</text>
<text x="855.0" y="361.8" font-size="15" font-weight="700" fill="#111111" text-anchor="middle" dominant-baseline="middle">→ 백엔드 서버</text>
<line x1="180" y1="232" x2="268" y2="232" stroke="#2f6fe4" stroke-width="1.6" marker-end="url(#blue)"/>
<text x="224.0" y="195.6" font-size="13" font-weight="400" fill="#2f6fe4" text-anchor="middle" dominant-baseline="middle">TCP 연결</text>
<text x="224.0" y="212.5" font-size="13" font-weight="400" fill="#2f6fe4" text-anchor="middle" dominant-baseline="middle">Cookie: sid=…</text>
<line x1="440" y1="232" x2="518" y2="232" stroke="#2f6fe4" stroke-width="1.6" marker-end="url(#blue)"/>
<text x="479.0" y="218.0" font-size="13" font-weight="400" fill="#2f6fe4" text-anchor="middle" dominant-baseline="middle">fd → 큐</text>
<line x1="690" y1="220" x2="768" y2="130" stroke="#2f6fe4" stroke-width="1.6" marker-end="url(#blue)"/>
<text x="760" y="168.0" font-size="13" font-weight="400" fill="#2f6fe4" text-anchor="middle" dominant-baseline="middle">인증 경로</text>
<line x1="690" y1="232" x2="768" y2="232" stroke="#2f6fe4" stroke-width="1.6" marker-end="url(#blue)"/>
<line x1="690" y1="244" x2="768" y2="344" stroke="#2f6fe4" stroke-width="1.6" marker-end="url(#blue)"/>
<text x="760" y="292.0" font-size="13" font-weight="400" fill="#2f6fe4" text-anchor="middle" dominant-baseline="middle">-R 규칙</text>
<line x1="768" y1="102" x2="692" y2="102" stroke="#2f6fe4" stroke-width="1.6" marker-end="url(#blue)"/>
<text x="730" y="49.5" font-size="13" font-weight="400" fill="#2f6fe4" text-anchor="middle" dominant-baseline="middle">조회 결과는</text>
<text x="730" y="66.5" font-size="13" font-weight="400" fill="#2f6fe4" text-anchor="middle" dominant-baseline="middle">복사본만</text>
<line x1="355" y1="200" x2="518" y2="116" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#gray)"/>
<text x="400" y="119.5" font-size="13" font-weight="400" fill="#8a8a8a" text-anchor="middle" dominant-baseline="middle">1초마다</text>
<text x="400" y="136.4" font-size="13" font-weight="400" fill="#8a8a8a" text-anchor="middle" dominant-baseline="middle">만료 정리</text>
<text x="944" y="406.0" font-size="12" font-weight="400" fill="#8a8a8a" text-anchor="end" dominant-baseline="middle">개념도</text>
</svg>
