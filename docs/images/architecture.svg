<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fe4"/></marker><marker id="blue-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2f6fe4"/></marker><marker id="pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e0457b"/></marker><marker id="pink-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#e0457b"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker><marker id="gray-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#8a8a8a"/></marker></defs>
<rect width="920" height="300" fill="#ffffff"/>
<text x="30" y="42" font-size="22" font-weight="700" fill="#111111">한눈에 보기</text>
<rect x="30" y="120" width="170" height="70" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="115.0" y="155.0" font-size="17" font-weight="700" fill="#111111" text-anchor="middle" dominant-baseline="middle">브라우저</text>
<rect x="370" y="120" width="190" height="70" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="465.0" y="144.6" font-size="16" font-weight="700" fill="#111111" text-anchor="middle" dominant-baseline="middle">웹 서버</text>
<text x="465.0" y="165.4" font-size="16" font-weight="700" fill="#111111" text-anchor="middle" dominant-baseline="middle">작업 스레드 ×8</text>
<rect x="720" y="120" width="170" height="70" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="805.0" y="144.6" font-size="16" font-weight="700" fill="#111111" text-anchor="middle" dominant-baseline="middle">Session 저장소</text>
<text x="805.0" y="165.4" font-size="16" font-weight="700" fill="#111111" text-anchor="middle" dominant-baseline="middle">서버 메모리</text>
<line x1="200" y1="140" x2="368" y2="140" stroke="#2f6fe4" stroke-width="1.6" marker-end="url(#blue)"/>
<text x="284.0" y="124.0" font-size="13" font-weight="400" fill="#2f6fe4" text-anchor="middle" dominant-baseline="middle">Cookie: sid=…</text>
<line x1="368" y1="172" x2="202" y2="172" stroke="#2f6fe4" stroke-width="1.6" marker-end="url(#blue)"/>
<text x="285.0" y="195.6" font-size="13" font-weight="400" fill="#2f6fe4" text-anchor="middle" dominant-baseline="middle">Set-Cookie: sid=…</text>
<text x="285.0" y="212.5" font-size="13" font-weight="400" fill="#2f6fe4" text-anchor="middle" dominant-baseline="middle">(로그인할 때)</text>
<line x1="560" y1="140" x2="718" y2="140" stroke="#2f6fe4" stroke-width="1.6" marker-end="url(#blue)"/>
<text x="639.0" y="124.0" font-size="13" font-weight="400" fill="#2f6fe4" text-anchor="middle" dominant-baseline="middle">sid로 조회</text>
<line x1="718" y1="172" x2="562" y2="172" stroke="#2f6fe4" stroke-width="1.6" marker-end="url(#blue)"/>
<text x="640.0" y="192.0" font-size="13" font-weight="400" fill="#2f6fe4" text-anchor="middle" dominant-baseline="middle">값을 복사해 반환</text>
<text x="805" y="222.0" font-size="13" font-weight="400" fill="#8a8a8a" text-anchor="middle" dominant-baseline="middle">1초마다 만료 정리</text>
<text x="460" y="262.0" font-size="14" font-weight="400" fill="#2f6fe4" text-anchor="middle" dominant-baseline="middle">연결(fd)은 식별에 쓰지 않음 — 사람은 Cookie의 Session ID로 구분</text>
<text x="904" y="286.0" font-size="12" font-weight="400" fill="#8a8a8a" text-anchor="end" dominant-baseline="middle">개념도</text>
</svg>
